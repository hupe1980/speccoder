# Setup scripts isolate the state directory (below).
experimental = ["setup-scripts"]

# The `speccoder` profile writes a JUnit report, the format speccoder's own
# verifier will read from target projects.
[profile.speccoder]
fail-fast = false

[profile.speccoder.junit]
path = "junit.xml"

# CI reports every failing test of a run, not only the first.
[profile.ci]
fail-fast = false

# Every test runs against a throwaway state directory (scripts/test-state.sh):
# a test, or a binary it spawns, that forgets to name one cannot reach the
# developer's real `~/.local/state/speccoder`.
[scripts.setup.isolated-state]
command = { command-line = "scripts/test-state.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter = "all()"
setup = "isolated-state"

[[profile.ci.scripts]]
filter = "all()"
setup = "isolated-state"

[[profile.speccoder.scripts]]
filter = "all()"
setup = "isolated-state"
