[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/speccoder"
authors = ["hupe1980"]
keywords = ["spec-kit", "coding-agent", "spec-driven", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
speccoder-core = { path = "crates/speccoder-core", version = "0.1.0-dev" }
speccoder-speckit = { path = "crates/speccoder-speckit", version = "0.1.0-dev" }
speccoder-openspec = { path = "crates/speccoder-openspec", version = "0.1.0-dev" }
speccoder-runtime = { path = "crates/speccoder-runtime", version = "0.1.0-dev" }

clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pulldown-cmark = { version = "0.13", default-features = false }
sha2 = "0.11"
toml = { version = "1", features = ["preserve_order"] }
quick-xml = "0.42"
agentplane = { version = "=0.52.0", default-features = false, features = ["embed"] }
async-trait = "0.1"
globset = "0.4"
ignore = "0.4"
regex = "1"
similar = "2"
schemars = "1"
tokio = { version = "1", features = ["rt", "process", "time"] }
serde-saphyr = "2.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process", "sched", "mount", "user", "fs"] }

assert_cmd = "2"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
