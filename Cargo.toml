[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/speccoder"
homepage = "https://hupe1980.github.io/speccoder/"
authors = ["hupe1980"]
keywords = ["spec-kit", "coding-agent", "spec-driven", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
speccoder-core = { path = "crates/speccoder-core", version = "0.3.0" }
speccoder-speckit = { path = "crates/speccoder-speckit", version = "0.3.0" }
speccoder-openspec = { path = "crates/speccoder-openspec", version = "0.3.0" }
speccoder-runtime = { path = "crates/speccoder-runtime", version = "0.3.0" }
speccoder-web = { path = "crates/speccoder-web", version = "0.3.0" }

clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pulldown-cmark = { version = "0.13", default-features = false }
sha2 = "0.11"
base64 = "0.22"
toml = { version = "1", features = ["preserve_order"] }
quick-xml = "0.42"
agentplane = { version = "=0.54.0", default-features = false, features = ["embed"] }
async-trait = "0.1"
globset = "0.4"
ignore = "0.4"
regex = "1"
similar = "2"
schemars = "1"
unicode-width = "0.2"
unicode-normalization = "0.1"
clap_complete = "4.6"
jsonschema = { version = "0.60", default-features = false }
tokio = { version = "1", features = ["rt", "process", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
serde-saphyr = "2.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process", "sched", "mount", "user", "fs"] }

assert_cmd = "2"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Line tables keep our backtraces readable; dependencies carry none. Full
# debug info made the ~35 test binaries tens of GB on Linux, more than a CI
# runner's free disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
