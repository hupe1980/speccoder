name: Attestation interop

# speccoder's attestations checked with other people's tools: ssh-keygen
# over the DSSE PAE rebuilt by hand, and in-toto's Go library on every
# statement (scripts/attest-interop.sh). Weekly and on demand; not a gate.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: pip install --user jsonschema
      - run: scripts/attest-interop.sh

  # Keyless Sigstore end to end: the job's own OIDC identity signs a tick's
  # summary, cosign verifies it against that identity.
  sigstore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: sigstore/cosign-installer@v3.8.1
      - run: cargo install --locked cargo-nextest@0.9.146
      - env:
          SPECCODER_SIGSTORE_TEST: "1"
          SPECCODER_SIGSTORE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          SPECCODER_SIGSTORE_ISSUER: https://token.actions.githubusercontent.com
        run: cargo nextest run -p speccoder-runtime --test attest sigstore
