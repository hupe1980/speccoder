name: Release

# Cuts a release from a tag `v<version>` (made after `just bump <version>`
# on main). Builds three speccoder archives without secrets, attests their
# build provenance, publishes the GitHub Release with the CHANGELOG notes, then —
# for a release, not a pre-release (`-` in the version) — publishes the
# crates and updates the Homebrew tap, and installs the result on clean
# runners.
#
# Owner setup (once, before the first real tag):
# - the tap hupe1980/homebrew-tap (the formula goes to Formula/speccoder.rb
#   beside its casks), and a GitHub App installed on that repository only,
#   with repository permission contents: read and write;
# - GitHub environment `release`, deployment rule: tags `v*`, holding
#   HOMEBREW_APP_ID and HOMEBREW_APP_PRIVATE_KEY (the App's ID and a private
#   key) and CARGO_REGISTRY_TOKEN: a crates.io API token with the scopes
#   publish-new and publish-update, limited to the crates `speccoder` and
#   `speccoder-*` (publish-new: of the six crates only `speccoder` exists
#   before the first release), with an expiry.
#
# Trusted publishing can only be set up for crates that already exist; after
# the first release it can replace the token.
#
# Third-party actions are pinned by commit: this workflow holds write tokens.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - id: check
        run: scripts/release/preflight.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: just publish-check

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup target add "$TARGET"
      - run: cargo build --release --locked -p speccoder --target "$TARGET"
      - name: Archive
        run: |
          name="speccoder-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/speccoder" LICENSE-APACHE LICENSE-MIT README.md CHANGELOG.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Smoke
        run: |
          bin="target/$TARGET/release/speccoder"
          if out="$("$bin" --version 2>&1)"; then
            [ "$out" = "speccoder $VERSION" ] || { echo "--version said: $out"; exit 1; }
          else
            echo "not executed: $TARGET does not run on $(uname -m) here ($out)"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: (cd dist && cat ./*.sha256 > SHA256SUMS && shasum -a 256 -c SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the GitHub Release
        run: |
          tag="v$VERSION"
          if state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$state" = true ] || { echo "release $tag is already published; assets are never overwritten"; exit 1; }
          else
            flags=()
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            scripts/release/changelog-section.sh "$VERSION" > notes.md
            gh release create "$tag" --draft --verify-tag --title "speccoder $VERSION" --notes-file notes.md "${flags[@]}"
          fi
          cp packaging/install.sh dist/speccoder-installer.sh
          # An upload GitHub took but did not answer is retried by gh and refused
          # as "already exists"; a second pass with --clobber replaces it.
          for attempt in 1 2 3; do
            gh release upload "$tag" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS dist/speccoder-installer.sh --clobber && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          gh release edit "$tag" --draft=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS

  crates:
    needs: [preflight, release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: The token is there
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "CARGO_REGISTRY_TOKEN is not set in the environment release"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - run: just publish-ci

  tap:
    needs: [preflight, release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-22.04
    environment: release
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: dist
      # A short-lived installation token that can write to the tap only.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: hupe1980
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hupe1980/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap
          persist-credentials: true
      - name: Update the formula
        run: |
          mkdir -p tap/Formula
          scripts/release/formula.sh "$VERSION" dist/SHA256SUMS > tap/Formula/speccoder.rb
          cd tap
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "speccoder release"
            git config user.email "speccoder-release@users.noreply.github.com"
            git add Formula/speccoder.rb
            git commit -m "speccoder $VERSION"
            git push
          fi

  smoke:
    needs: [preflight, release, tap]
    if: always() && needs.release.result == 'success' && needs.tap.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer
        run: |
          sh packaging/install.sh --version "$VERSION" --to "$RUNNER_TEMP/bin"
          [ "$("$RUNNER_TEMP/bin/speccoder" --version)" = "speccoder $VERSION" ]
      # On Linux the installer above is the main path; Homebrew is checked on macOS.
      - name: Homebrew
        if: env.PRERELEASE == 'false' && runner.os == 'macOS'
        run: |
          brew install hupe1980/tap/speccoder
          brew test speccoder
