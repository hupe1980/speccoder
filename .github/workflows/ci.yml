name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The sandbox escape suite fails instead of skipping where there is no sandbox.
  SPECCODER_REQUIRE_SANDBOX: "1"

# One job per OS, each running exactly `just ci`, so a green local `just ci`
# predicts a green run here. Nothing in this workflow publishes.
jobs:
  ci:
    name: just ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny
      - run: just ci

  # The web interface is embedded from its committed build: rebuilding it
  # from source must give the same files, so what ships is what is reviewed.
  ui:
    name: web interface builds to the committed bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/speccoder-web/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/speccoder-web/ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- dist
      # The interface ships inside the binary, so its size hardly matters;
      # this only catches an accidental giant dependency (1 MB gzipped).
      - run: test "$(cat dist/* | gzip -9 | wc -c)" -lt 1048576
