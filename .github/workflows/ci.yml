name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The sandbox escape suite fails instead of skipping where there is no sandbox.
  SPECCODER_REQUIRE_SANDBOX: "1"

# One job per OS, each running exactly `just ci`, so a green local `just ci`
# predicts a green run here. Nothing in this workflow publishes.
jobs:
  ci:
    name: just ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 23.10+ restricts unprivileged user namespaces (AppArmor); the
      # sandbox then degrades and says so. CI tests the full sandbox.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: rustup toolchain install # from rust-toolchain.toml
      # A red run warms the cache too: most of a cold run is compiling.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny
      - run: just ci

  # The web interface is embedded from its committed build: rebuilding it
  # from source must give the same files, so what ships is what is reviewed.
  ui:
    name: web interface builds to the committed bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/speccoder-web/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/speccoder-web/ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
      # The interface ships inside the binary, so its size hardly matters;
      # this only catches an accidental giant dependency (4 MB gzipped;
      # Mermaid, loaded only for a diagram, is most of it).
      - run: test "$(cat dist/* | gzip -9 | wc -c)" -lt 4194304

  # Dogfood: the speccoder-verify action on this repository's own pull
  # requests, from its path here. This repository commits no specs, so the
  # check is neutral (allowed): it proves the workflow token creates the
  # `speccoder / evidence` check run, not ticks. It runs once the action's
  # release exists (the action only runs a released, attested binary).
  evidence:
    name: speccoder / evidence (dogfood)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^    default: "([^"]+)" # the release this action is cut with.*/\1/p' packaging/speccoder-verify-action/action.yml)"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::speccoder-verify v$version is not released yet: the dogfood check starts with that release"
          fi
      - if: steps.release.outputs.exists == 'true'
        uses: ./packaging/speccoder-verify-action
        with:
          allow-neutral: true

  # The verifier's size and speed on a hosted runner (SC-003, SC-004): a
  # feature of 50 signed ticks, the release-verify binary served as the
  # action downloads it, timed end to end.
  verifier-performance:
    name: speccoder-verify checks 50 ticks in under 10 s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile release-verify --locked -p speccoder-verify --target x86_64-unknown-linux-musl
      - run: scripts/verify-performance.sh target/x86_64-unknown-linux-musl/release-verify/speccoder-verify

