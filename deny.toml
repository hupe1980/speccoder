# cargo-deny policy (`just deny`). Licences must be compatible with shipping
# speccoder as MIT OR Apache-2.0; duplicate versions only warn on day one.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Through Tauri's Linux stack (gtk3-macros), only with the `app` feature;
    # a build-time macro crate, no code of it runs in the window.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk3-macros, `app` feature only, build time only" },
    # crypto-bigint 0.5 through p256 0.13, which aws-config's `aws login`
    # credentials sign their DPoP proofs with; no 0.5 release is fixed and
    # aws-config pins p256 0.13. A local timing side channel on the session's
    # own key, in speccoder's process only.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via p256 0.13 in aws-config's credentials-login; no fixed 0.5 release" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Arrived with agentplane, both permissive and compatible with
    # MIT OR Apache-2.0: MIT without attribution (borrow-or-share) and the
    # data licence of the Mozilla CA bundle (webpki-root-certs).
    "MIT-0",
    "CDLA-Permissive-2.0",
]
# MPL-2.0 is file-level copyleft: shipping these unmodified is compatible
# with MIT OR Apache-2.0. Allowed per crate, not globally, and all arrive
# with the optional desktop window (Tauri, feature `app`).
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Layering: only the runtime crate embeds the execution substrate.
    { crate = "agentplane", wrappers = ["speccoder-runtime"], reason = "only speccoder-runtime may depend on agentplane" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
