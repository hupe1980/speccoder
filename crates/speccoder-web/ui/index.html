<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>speccoder</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- The splash: drawn from the first frame, before any script —
         the app's mark, whose tick draws itself, on the app's own
         background; the app fades it out when its first data is in. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #f5f5f7; color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Inter, "Segoe UI", system-ui, sans-serif;
        transition: opacity 420ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #splash.out { opacity: 0; transform: scale(1.015); pointer-events: none; }
      #splash .stack { display: grid; justify-items: center; gap: 0.9rem; transform: translateY(-4vh); }
      #splash svg { width: 84px; height: 84px; filter: drop-shadow(0 10px 24px rgba(0, 96, 223, 0.28)); animation: rise 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      #splash .tick { stroke-dasharray: 48; stroke-dashoffset: 48; animation: draw 620ms 260ms cubic-bezier(0.65, 0, 0.35, 1) forwards; }
      #splash .name { font-size: 1.55rem; font-weight: 650; letter-spacing: -0.02em; animation: fade 600ms 380ms both; }
      #splash .line { font-size: 0.86rem; color: rgba(60, 60, 67, 0.6); animation: fade 600ms 520ms both; }
      #splash .track { width: 132px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(120, 120, 128, 0.16); margin-top: 0.6rem; animation: fade 400ms 900ms both; }
      #splash .slow { font-size: 0.8rem; color: rgba(60, 60, 67, 0.6); opacity: 0; animation: appear 500ms 5s forwards; }
      #splash.dark { background: #121214; color: #f5f5f7; }
      #splash.dark .line, #splash.dark .slow { color: rgba(235, 235, 245, 0.55); }
      #splash.light { background: #f5f5f7; color: #1d1d1f; }
      #splash .track i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #007aff; animation: slide 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      @keyframes rise { from { opacity: 0; transform: scale(0.86) translateY(6px); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
      @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-color-scheme: dark) {
        #splash:not(.light) { background: #121214; color: #f5f5f7; }
        #splash:not(.light) .line, #splash:not(.light) .slow { color: rgba(235, 235, 245, 0.55); }
        #splash .track { background: rgba(120, 120, 128, 0.32); }
        #splash .track i { background: #0a84ff; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; transition: none !important; }
        #splash .tick { stroke-dashoffset: 0; }
        #splash .track { display: none; }
        #splash .slow { animation: appear 1ms 5s forwards !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="speccoder is starting">
      <div class="stack">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b9bff" /><stop offset="1" stop-color="#0060df" /></linearGradient></defs>
          <rect width="64" height="64" rx="15" fill="url(#sg)" />
          <path class="tick" d="M19 33.5 28.5 43 46 22" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="name">speccoder</div>
        <div class="line">Spec-driven coding, decided by evidence.</div>
        <div class="track" aria-hidden="true"><i></i></div>
        <div class="slow">Still reading the project…</div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
