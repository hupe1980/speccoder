[package]
name = "speccoder-runtime"
description = "Application services of speccoder: the only crate that executes anything."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["engine"]
# Everything that runs a model, opens a socket or reads the keychain: the
# substrate, the GitHub client, sign-in. Off, the crate is the read-only half
# `speccoder-verify` builds on (git, the format adapters, attestation checks).
engine = ["dep:agentplane", "dep:async-trait", "dep:tokio", "dep:reqwest", "dep:keyring"]

[dependencies]
pulldown-cmark = { workspace = true, features = ["html"] }
speccoder-core.workspace = true
speccoder-speckit.workspace = true
speccoder-openspec.workspace = true
agentplane = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
globset.workspace = true
ignore.workspace = true
regex.workspace = true
similar.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["rt"], optional = true }
reqwest = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
nix.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
tempfile.workspace = true
toml.workspace = true
serde-saphyr.workspace = true
toml_edit = "0.25.17"

[dev-dependencies]
base64.workspace = true
agentplane = { workspace = true, features = ["fake-model", "testkit"] }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
libc = "0.2"
