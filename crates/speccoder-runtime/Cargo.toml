keyring = { workspace = true }
nix.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
tempfile.workspace = true
toml.workspace = true
serde-saphyr.workspace = true
