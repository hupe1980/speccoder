[package]
name = "speccoder"
description = "Spec-driven coding, decided by evidence: works through GitHub Spec Kit and OpenSpec tasks and ticks one only when tests derived from the spec prove it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
# The window's build (`--features app`) reads these.
include = ["/src", "/build.rs", "/tauri.conf.json", "/icons", "/LICENSE-APACHE", "/LICENSE-MIT"]
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# `cargo binstall speccoder` takes the release archive instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "speccoder"
path = "src/main.rs"

[dependencies]
speccoder-core.workspace = true
speccoder-runtime.workspace = true
speccoder-web.workspace = true
clap.workspace = true
clap_complete.workspace = true
ratatui.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

# The desktop window (`speccoder ui --window`): on Linux behind the `app`
# feature (it needs WebKitGTK installed); on macOS and Windows always, on
# the system's own WebView (WKWebView, WebView2), which adds no library.
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2.8", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = { version = "2.8" }

[build-dependencies]
tauri-build = { version = "2" }

[features]
default = []
app = ["dep:tauri", "dep:tauri-plugin-dialog"]

[dev-dependencies]
assert_cmd.workspace = true
base64.workspace = true
jsonschema.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
